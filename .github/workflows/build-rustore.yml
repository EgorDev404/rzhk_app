name: Build AAB for RuStore

# Ручной запуск: GitHub → Actions → "Build AAB for RuStore" → Run workflow.
# Ничего не публикуется в GitHub Releases: файлы остаются только в Artifacts (видны вам).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustore-build
  cancel-in-progress: false

jobs:
  build-rustore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Секреты передаём через env + printf — так JSON/кавычки внутри секрета не ломают shell
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::Секрет GOOGLE_SERVICES_JSON пуст — google-services.json не создан"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle сам кеширует ~/.gradle, отдельный actions/cache не нужен
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read version
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts || echo "?")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME, versionCode=$CODE"

      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      # AAB = один пакет со всеми ABI (arm64-v8a, armeabi-v7a, ...).
      # RuStore сам отдаёт каждому устройству только нужные библиотеки.
      - name: Build release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Запасной вариант: RuStore принимает и APK (подпись должна совпадать с прошлыми версиями)
      - name: Build release APK (запасной вариант)
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Check AAB (ABI и подпись)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"

          echo "--- ABI внутри AAB ---"
          ABIS=$(unzip -Z1 "$AAB" | grep -oP '^base/lib/\K[^/]+' | sort -u || true)
          if [ -z "$ABIS" ]; then
            echo "Нативных библиотек нет — приложение чисто Java/Kotlin, ABI не важны."
          else
            echo "$ABIS"
            echo "$ABIS" | grep -qx "arm64-v8a"   || echo "::warning::В AAB нет arm64-v8a"
            echo "$ABIS" | grep -qx "armeabi-v7a" || echo "::warning::В AAB нет armeabi-v7a (проверьте abiFilters в build.gradle.kts)"
          fi

          echo "--- Подпись AAB (сверьте SHA-256 с сертификатом в RuStore Консоли) ---"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256|Valid"

          # Публичный сертификат ключа в PEM — нужен RuStore Консоли для загрузки AAB
          keytool -exportcert -rfc \
            -keystore app/release-key.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -file upload_certificate.pem

      - name: Upload AAB (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-rustore-aab-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/bundle/release/*.aab
            upload_certificate.pem
          if-no-files-found: error

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-rustore-apk-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Summary
        run: |
          {
            echo "### Сборка для RuStore"
            echo "- versionName: \`${{ steps.version.outputs.name }}\`"
            echo "- versionCode: \`${{ steps.version.outputs.code }}\` (в RuStore должен быть **больше**, чем у прошлой версии)"
            echo "- Файлы: AAB + upload_certificate.pem в артефакте \`...-aab-...\`, запасной APK в \`...-apk-...\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Ключ не должен оставаться на раннере
      - name: Cleanup secrets
        if: always()
        run: rm -f app/release-key.jks app/google-services.json upload_certificate.pem
