name: Build APK

on:
  workflow_dispatch:   # кнопка «Run workflow» во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Тесты логики поиска файлов. Не блокируют сборку: сигнал, а не преграда.
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # Обычная сборка — должна пройти всегда.
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Оптимизированная сборка (R8): заметно плавнее. Если вдруг не соберётся — останется debug.
      - name: Build release APK (optimized)
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
