name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Тесты логики поиска файлов. Не блокируют сборку: сигнал, а не преграда.
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      # Оптимизированная сборка (R8): заметно плавнее.
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Обычная debug-сборка на случай, если release не подписан.
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore