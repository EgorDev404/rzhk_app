name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # ← нужно для создания релиза

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode keystore
        run: echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > app/release-key.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Читаем versionName из Gradle — тег релиза будет совпадать с версией в приложении
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION"

      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload debug APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # Публикация в GitHub Releases (публично видно всем)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Release v${{ steps.version.outputs.name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false