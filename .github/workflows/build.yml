name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Читаем versionName из Gradle, чтобы тег релиза совпадал с версией в приложении.
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION"

      # Тесты логики поиска файлов. Не блокируют сборку: сигнал, а не преграда.
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      # Оптимизированная сборка (R8): заметно плавнее.
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Постоянный релиз с APK. Исходники GitHub приложит сам — Source code (zip/tar.gz).
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Release v${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true